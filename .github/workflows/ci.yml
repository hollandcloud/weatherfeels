name: CI

# Build and test on every pull request, and on whatever lands on main.
#
# Deliberately holds no secrets and names no environment. This repository is public, so a
# pull request can arrive from a stranger's fork; GitHub withholds secrets from fork
# workflows, but the safer property is that this job has nothing to withhold. Anything
# needing credentials lives in testflight.yml, which only main can reach.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push makes an older run pointless. Unlike the upload workflow there is nothing
# half-finished to leave behind, so cancelling is free.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    # GitHub-hosted only, never a self-hosted runner. On a public repository a fork's pull
    # request would otherwise execute arbitrary code on our own machine, which is exactly
    # the trade GitHub warn against — and the runner in question is a Mac on the homelab.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      # The whole suite lives in the SwiftPM package, so this needs no Xcode project and no
      # simulator — which also keeps it quick enough to sit on every pull request.
      - name: Run the test suite
        working-directory: Packages/WeatherStarCore
        run: swift test

      # Guards the thing a test cannot: the app targets are generated from project.yml, and
      # a malformed spec fails here rather than at release time. This has bitten before —
      # an indentation error made xcodegen fail silently and the project regenerated wrong.
      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Regenerate the project
        run: xcodegen generate

      - name: Confirm the generated project is buildable
        run: |
          xcodebuild -project WeatherStar.xcodeproj \
            -scheme "WeatherStar (iOS)" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            build
