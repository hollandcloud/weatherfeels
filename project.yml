# XcodeGen spec. Regenerate the project with:
#   xcodegen generate
#
# The .xcodeproj is intentionally not committed — this file is the source of truth,
# which keeps the repo diffable and avoids project-file merge conflicts.

name: WeatherStar

options:
  bundleIdPrefix: net.weatherstar
  deploymentTarget:
    iOS: "17.0"
    tvOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

# ---------------------------------------------------------------------------
# Set these two before your first build.
#
# WS4K_BUNDLE_ID must be a reverse-DNS identifier you control and that nobody has
# registered yet. Apple reports "cannot be registered ... it is not available" when
# the identifier already exists — including one you registered earlier under a
# different Apple ID or team. Check developer.apple.com → Certificates, Identifiers
# & Profiles → Identifiers before picking, and add a suffix if it is taken.
#
# WS4K_TEAM_ID is your 10-character Apple Developer Team ID. Simulator builds work
# without it; device builds and archives do not. If you are building your own copy,
# replace it with yours — find it with:
#   security find-identity -v -p codesigning | grep "Apple Development"
# (the parenthesised code is the team ID).
#
# App Store Connect record this identifier is bound to:
#   Bundle ID  net.hlnd.weatherstar   (identifier name "WeatherStar4000")
#   SKU        net.hlnd.ws4kp
#   Apple ID   6797599321             (used when uploading, not a build setting)
# One record carries the iOS, tvOS and macOS builds, which is why all three targets
# share the same bundle identifier.
# ---------------------------------------------------------------------------
settings:
  base:
    WS4K_BUNDLE_ID: net.hlnd.weatherstar
    WS4K_TEAM_ID: 2KD5ZL97LH
    MARKETING_VERSION: "1.0"
    # Date-based, matching what has already been uploaded: the build reviewed on
    # 20 August was 20260817.1, and App Store Connect rejects anything not higher than
    # the last one it saw. This file still said "10", which would have been refused.
    CURRENT_PROJECT_VERSION: "20260826.1"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: $(WS4K_TEAM_ID)
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    # ---- Branding -----------------------------------------------------------
    # Build-time, not a user setting: whoever ships a copy decides what mark it
    # carries. Read by `StarBranding`; everything falls back to the bundled
    # WeatherStar 4000+ artwork when unset, so leaving these alone changes nothing.
    #
    #   WS4KLogoImageName   an image in the app's own Assets.xcassets, replacing the
    #                       corner logo. Add it to Apps/<platform>/Assets.xcassets.
    #   WS4KStartupTitle    startup screen, first line  (default "WeatherStar")
    #   WS4KStartupSubtitle startup screen, second line (default "4000+";
    #                       set to an empty string for a single-line title)
    #
    # Set these in Apps/<platform>/Info.plist, not here. `INFOPLIST_KEY_` prefixed
    # build settings only reach the bundle when Xcode *generates* the Info.plist, and
    # these targets each use an explicit one — set that way the keys are silently
    # dropped, and the build looks like it worked.
    # Uncomment to enable private iCloud music sync. Also requires an iCloud
    # container in the target entitlements — see README.md.
    # SWIFT_ACTIVE_COMPILATION_CONDITIONS: WS4K_CLOUDKIT

packages:
  WeatherStarCore:
    path: Packages/WeatherStarCore

targetTemplates:
  App:
    type: application
    sources:
      - path: Apps/${platformDir}
      # The CRT shader has to be compiled by Xcode into each app's default.metallib:
      # SwiftPM will not build `.metal` inside the package, so it cannot live beside the
      # view that uses it. `ShaderLibrary.default` then finds it in the main bundle.
      - path: Shaders/StarCRT.metal
    dependencies:
      - package: WeatherStarCore
        product: WeatherStarUI
      - package: WeatherStarCore
        product: WeatherStarKit
    settings:
      base:
        INFOPLIST_FILE: Apps/${platformDir}/Info.plist
        PRODUCT_NAME: weatherfeels
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: NO
        # Icons are generated by Tools/MakeIcons.swift into Apps/<platform>/Assets.xcassets.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

targets:
  WeatherStar-iOS:
    templates: [App]
    templateAttributes:
      platformDir: iOS
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(WS4K_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1,2" # iPhone and iPad
        SUPPORTS_MACCATALYST: NO

  WeatherStar-tvOS:
    templates: [App]
    templateAttributes:
      platformDir: tvOS
    platform: tvOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(WS4K_BUNDLE_ID)
        # tvOS's icon is a layered brand asset, named through the same setting.
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"

  WeatherStar-macOS:
    templates: [App]
    templateAttributes:
      platformDir: macOS
    platform: macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(WS4K_BUNDLE_ID)
        CODE_SIGN_ENTITLEMENTS: Apps/macOS/WeatherStar.entitlements
        COMBINE_HIDPI_IMAGES: YES

schemes:
  WeatherStar (iOS):
    build:
      targets:
        WeatherStar-iOS: all
    run:
      config: Debug
  WeatherStar (tvOS):
    build:
      targets:
        WeatherStar-tvOS: all
    run:
      config: Debug
  WeatherStar (macOS):
    build:
      targets:
        WeatherStar-macOS: all
    run:
      config: Debug
